version: '3.8'

services:
  # Frontend - Nginx serving React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: eidossec/frontend:latest
    container_name: eidossec-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - eidossec-network
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend - FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eidossec/backend:latest
    container_name: eidossec-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidossec-network
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://eidossec:${DB_PASSWORD}@postgres:5432/eidossec
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./projects:/app/projects:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker - Background task processor
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eidossec/backend:latest
    container_name: eidossec-celery
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eidossec-network
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://eidossec:${DB_PASSWORD}@postgres:5432/eidossec
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./projects:/app/projects:ro
      - ./logs:/app/logs

  # Scanner Worker - Executes security tools
  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    image: eidossec/scanner:latest
    container_name: eidossec-scanner
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eidossec-network
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./projects:/app/projects:ro
      - ./scan-results:/app/scan-results
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eidossec-db
    networks:
      - eidossec-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eidossec
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=eidossec
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidossec"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Message queue and cache
  redis:
    image: redis:7-alpine
    container_name: eidossec-redis
    networks:
      - eidossec-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  eidossec-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
