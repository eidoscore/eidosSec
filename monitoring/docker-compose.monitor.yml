version: '3.8'

services:
  cicd-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: eidossec-cicd-monitor
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

networks:
  monitoring:
    name: eidossec-monitoring
