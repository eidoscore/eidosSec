name: Manually Fix Permissions
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Force Clean Workspace
        run: |
          echo "🛑 Stopping monitoring agent to release file locks..."
          sudo docker rm -f eidossec-monitoring || true
          
          echo "🧹 Manually fixing permissions (AGGRESSIVE MODE)..."
          
          # Fix permissions of the work directory
          sudo chown -R $USER:$USER . || true
          
          # Force delete the monitoring/data directory specifically (this is the culprit)
          echo "🔥 Nuking monitoring/data..."
          sudo rm -rf monitoring/data || true
          
          # If still stuck, try deleting the entire directory content manually
          # Only do this if we are SURE we are in the runner workspace
          echo "💥 Clearing workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.git || true
          
          echo "✅ Workspace completely wiped. Next checkout MUST succeed."
