name: Deploy Full Stack to Server

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scanner/**'
      - 'monitoring/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-full-stack.yml'
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: eidossec

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Clean Workspace (Pre-Checkout)
        run: |
          echo "🧹 Pre-cleaning workspace to fix EACCES issues..."
          sudo docker rm -f eidossec-monitoring || true
          sudo chown -R $USER:$USER . || true
          
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Report deployment start
        run: |
          curl -X POST http://localhost:9000/api/deployments \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_id\": \"${{ github.sha }}\",
              \"status\": \"deploying\",
              \"started_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"branch\": \"${{ github.ref_name }}\"
            }" || true
            
      - name: Create .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.template .env
            echo "🔧 Environment setup complete"
          fi
          
      - name: Fix Docker Socket Permissions (Auto-Repair)
        run: |
          echo "🔧 Checking Docker socket..."
          sudo chmod 666 /var/run/docker.sock || true
          
      - name: Build services
        run: |
          echo "🔨 Building Monitoring Agent (No-Cache)..."
          docker compose build --no-cache monitoring 2>&1 | tee monitoring_build.log || {
            echo "❌ Monitoring build failed"
            cat monitoring_build.log
            exit 1
          }
          
          echo "🔨 Building remaining services..."
          docker compose build 2>&1 | tee full_build.log
          
      - name: Reset project containers
        run: |
          echo "🛑 Container Reset..."
          docker compose down --remove-orphans || true
          
      - name: Start Monitoring Agent
        run: |
          echo "🧹 Cleaning up legacy monitoring containers if any..."
          docker stop eidos-monitoring || true
          docker rm eidos-monitoring || true
          
          echo "👀 Starting autonomous monitoring agent..."
          docker compose up -d monitoring
          
          echo "⏳ Waiting for monitoring agent..."
          timeout 60 sh -c 'until curl -f http://localhost:9000/health; do sleep 2; done' || {
            echo "❌ Monitoring agent failed to start"
            docker compose logs monitoring
          }
          
      - name: Run database migrations
        run: |
          echo "🚀 Starting database..."
          docker compose up -d postgres redis
          
          echo "⏳ Waiting for database..."
          sleep 15
          
          echo "🗄️  Running database migrations..."
          timeout 300 docker compose run --rm backend alembic upgrade head 2>&1 | tee migration.log || {
            echo "❌ Migrations FAILED or TIMED OUT"
            docker compose logs postgres
          }
          
      - name: Start remaining services
        run: |
          echo "🚀 Starting all services for $COMPOSE_PROJECT_NAME..."
          docker compose up -d
          
      - name: Wait for health checks
        run: |
          echo "⏳ Waiting for services to be healthy..."
          sleep 15
          
          # Check health locally
          docker compose ps
          
      - name: Show service status
        run: |
          echo "📊 Service Status for $COMPOSE_PROJECT_NAME:"
          docker compose ps
          
      - name: Report deployment success
        if: success()
        run: |
          curl -X PATCH http://localhost:9000/api/deployments/${{ github.sha }} \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"success\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"services\": [\"backend\", \"frontend\", \"scanner\", \"postgres\", \"redis\"]
            }" || true
            
      - name: Report deployment failure
        if: failure()
        run: |
          # Capture build log or deploy log
          ERROR_LOG="Deployment failed."
          if [ -f build.log ]; then
            ERROR_LOG=$(tail -n 20 build.log | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          fi
          
          curl -X PATCH http://localhost:9000/api/deployments/${{ github.sha }} \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"failed\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"error\": \"$ERROR_LOG\"
            }" || true
          
          echo "📋 Container logs:"
          docker compose logs --tail=50
